version: "3.8"

services:
  nginx:
    build:
      context: ./nginx
    container_name: nginx
    ports:
      - "8080:8090"
    restart: always
    networks:
      - notes-app
    depends_on:
      - django

  db:
    container_name: mysql
    image: mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db
    networks:
      - notes-app
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/admin || exit 1"]
      interval: 10s
      retries: 5
      start_period: 60s


  django:
    build:
      context: .
    container_name: django_cont
    command: sh -c "python manage.py migrate --no-input && gunicorn notesapp.wsgi --bind 0.0.0.0:8090"
    ports:
      - "8080:8090"
    env_file:
      - ".env"
    restart: always
    depends_on:
      - db
    networks:
      - notes-app

networks:
  notes-app:
